name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:publish
      - run: npm test
      - run: npm run test:runtime
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:publish
      - run: npm run package:source
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prism-source
          path: |
            work/releases/*.tar.gz
            work/releases/*.sha256
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm run docker:config
      - run: docker build --file deploy/docker/Dockerfile --tag prism-ci .
      - run: docker run --detach --rm --name prism-ci --publish 127.0.0.1:4321:4317 prism-ci
      - run: npm run test:runtime -- --url http://127.0.0.1:4321
      - if: always()
        run: docker logs prism-ci || true
      - if: always()
        run: docker stop prism-ci || true
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 2s --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:cache:redis
        env:
          PRISM_TEST_REDIS_URL: redis://127.0.0.1:6379
