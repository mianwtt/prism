services:
  prism:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      HOST: 0.0.0.0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - prism-data:/app/data
volumes:
  prism-data:
