services:
  searxng:
    image: searxng/searxng@sha256:462d8dbeadd7c7c304be08d47084f5caba70f47a9145a01fd25990a7944e61b7
    ports:
      - "127.0.0.1:4330:8080"
    volumes:
      - ../../work/search-service/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/prism_bing_rss.py:/usr/local/searxng/searx/engines/prism_bing_rss.py:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:4330/
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
