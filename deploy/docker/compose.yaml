name: prism
services:
  prism:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      HOST: 0.0.0.0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_SEARCH_TTL_SECONDS: ${REDIS_SEARCH_TTL_SECONDS:-300}
      REDIS_CACHE_TIMEOUT_MS: ${REDIS_CACHE_TIMEOUT_MS:-300}
    volumes:
      - prism-data:/app/data
  redis:
    image: redis:7.4-alpine
    profiles: [cache]
    ports:
      - "127.0.0.1:6379:6379"
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 5
volumes:
  prism-data:
