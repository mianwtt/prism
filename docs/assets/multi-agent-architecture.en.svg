<text x="60" y="478" fill="#183e37" font-size="20" font-weight="600" >Public-source tools</text>
<text x="60" y="509" fill="#526773" font-size="16" font-weight="400" >tofu-search / Tavily · Catalogs and pages</text>
<text x="60" y="535" fill="#526773" font-size="15" font-weight="400" >Optional Redis: reuse search results</text>
<rect x="420" y="446" width="340" height="110" rx="12" fill="#f8fafc" stroke="#d6e1e7"/>
<text x="440" y="478" fill="#183e37" font-size="20" font-weight="600" >SQLite stage checkpoints</text>
<text x="440" y="509" fill="#526773" font-size="16" font-weight="400" >Parent graph saves completed stages</text>
<text x="440" y="535" fill="#526773" font-size="15" font-weight="400" >Interrupted requests may repeat</text>
<rect x="800" y="446" width="448" height="110" rx="12" fill="#f8fafc" stroke="#d6e1e7"/>
<text x="820" y="478" fill="#183e37" font-size="20" font-weight="600" >What-if decision canvas</text>
<text x="820" y="509" fill="#526773" font-size="16" font-weight="400" >Matching choices · Evidence · Conversation</text>
<text x="820" y="535" fill="#526773" font-size="15" font-weight="400" >Known condition edits: no model or search</text>
<path d="M 1024 556 L 1024 578" fill="none" stroke="#638b82" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="800" y="578" width="448" height="40" rx="10" fill="#eaf5f0" stroke="#c5ded3"/>
<text x="1024" y="604" fill="#246e5e" font-size="16" font-weight="500" text-anchor="middle">Save decision versions: choice · reasons · evidence</text>
<text x="40" y="589" fill="#526773" font-size="15" font-weight="400" >At most two model reviews; unavailable review is recorded.</text>
<text x="40" y="618" fill="#526773" font-size="15" font-weight="400" >Four roles are not four models or a fixed number of model calls.</text>
