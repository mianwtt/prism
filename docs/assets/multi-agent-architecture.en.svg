<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="664" viewBox="0 0 1280 664" role="img" aria-labelledby="title desc" lang="en" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-style="normal"><title id="title">From public sources to traceable decisions</title><desc id="desc">Four specialist roles exchange structured tasks; program rules retain authority over user conditions. Four roles are not four models or a fixed number of model calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#638b82"/></marker></defs><rect width="1280" height="664" rx="16" fill="#ffffff"/>
<text x="40" y="36" fill="#247260" font-size="12" font-weight="600" letter-spacing="1.6">PRISM / MULTI-AGENT RESEARCH</text>
<text x="1240" y="36" fill="#526773" font-size="14" font-weight="400" text-anchor="end">Shared model service · Sequential execution</text>
<text x="40" y="79" fill="#183e37" font-size="30" font-weight="650" >From public sources to traceable decisions</text>
<text x="40" y="111" fill="#526773" font-size="17" font-weight="400" >Four specialist roles exchange structured tasks; program rules retain authority over user conditions.</text>
<rect x="28" y="190" width="1232" height="210" rx="16" fill="#f5f8fa" stroke="#e1e9ee"/>
