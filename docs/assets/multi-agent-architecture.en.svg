<text x="624" y="159" fill="#246e5e" font-size="15" font-weight="500" text-anchor="middle">Evidence gaps: at most one repair round</text>
<rect x="40" y="210" width="232" height="170" rx="12" fill="#fff" stroke="#d6e1e7"/>
<path d="M 52 211 H 260" stroke="#2b806c" stroke-width="3"/>
<text x="60" y="241" fill="#688c81" font-size="13" font-weight="600" >01</text>
<text x="60" y="273" fill="#183e37" font-size="22" font-weight="650" >Coordinator</text>
<text x="60" y="305" fill="#526773" font-size="16" font-weight="400" >Define comparison fields</text>
<text x="60" y="330" fill="#526773" font-size="16" font-weight="400" >Set conditions and queries</text>
<text x="60" y="355" fill="#526773" font-size="16" font-weight="400" >Keep requirements intact</text>
<rect x="352" y="210" width="232" height="170" rx="12" fill="#fff" stroke="#d6e1e7"/>
<path d="M 364 211 H 572" stroke="#2b806c" stroke-width="3"/>
<text x="372" y="241" fill="#688c81" font-size="13" font-weight="600" >02</text>
<text x="372" y="273" fill="#183e37" font-size="22" font-weight="650" >Researcher</text>
<text x="372" y="305" fill="#526773" font-size="16" font-weight="400" >Search and read public pages</text>
<text x="372" y="330" fill="#526773" font-size="16" font-weight="400" >Bind observations to sources</text>
<text x="372" y="355" fill="#526773" font-size="16" font-weight="400" >Keep missing facts unknown</text>
<rect x="664" y="210" width="232" height="170" rx="12" fill="#fff" stroke="#d6e1e7"/>
<path d="M 676 211 H 884" stroke="#2b806c" stroke-width="3"/>
<text x="684" y="241" fill="#688c81" font-size="13" font-weight="600" >03</text>
<text x="684" y="273" fill="#183e37" font-size="22" font-weight="650" >Reviewer</text>
<text x="684" y="305" fill="#526773" font-size="16" font-weight="400" >Check identity, specs, prices</text>
<text x="684" y="330" fill="#526773" font-size="16" font-weight="400" >Withhold disputed fields</text>
<text x="684" y="355" fill="#526773" font-size="16" font-weight="400" >Cite evidence for findings</text>
<rect x="1016" y="210" width="232" height="170" rx="12" fill="#fff" stroke="#d6e1e7"/>
<path d="M 1028 211 H 1236" stroke="#2b806c" stroke-width="3"/>
<text x="1036" y="241" fill="#688c81" font-size="13" font-weight="600" >04</text>
<text x="1036" y="273" fill="#183e37" font-size="22" font-weight="650" >Analyst</text>
<text x="1036" y="305" fill="#526773" font-size="16" font-weight="400" >Explain evaluated tradeoffs</text>
<text x="1036" y="330" fill="#526773" font-size="16" font-weight="400" >Retain facts and citations</text>
<text x="1036" y="355" fill="#526773" font-size="16" font-weight="400" >Never rewrite eligibility</text>
