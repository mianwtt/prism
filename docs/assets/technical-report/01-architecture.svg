<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>01-architecture</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#FBFCFD" stroke="none" /><path d="M220,195 L220,235" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M600,195 L600,235" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M980,195 L980,235" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M390,285 L435,285" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M600,345 L600,368" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M600,368 L220,368" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M220,368 L220,395" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M390,450 L435,450" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M770,450 L815,450" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M435,320 L410,320" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M410,320 L410,530" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M410,530 L220,530" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M220,530 L220,555" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M770,300 L792,300" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M792,300 L792,540" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M792,540 L600,540" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M600,540 L600,555" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">01  系统架构：运行层、研究层、决策层分工</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">绿色：确定性业务与应用服务；蓝色：模型与研究；金色：可丢弃缓存；底部：持久化</text><rect x="55" y="110" width="1090" height="85" rx="12" fill="white" stroke="#C5D3D8" /><rect x="55" y="110" width="5" height="85" rx="2" fill="#28786D" stroke="none" /><text x="73" y="142" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">浏览器工作区</text><text x="73" y="170" font-size="18" fill="#647780" font-weight="400" text-anchor="start">原生 ES Modules · 条件控件 · HTML/SVG 分支画布 · dialog 详情</text><rect x="55" y="235" width="335" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="55" y="235" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="73" y="267" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">Node HTTP API</text><text x="73" y="295" font-size="18" fill="#647780" font-weight="400" text-anchor="start">路由、校验、静态资源</text><text x="73" y="321" font-size="18" fill="#647780" font-weight="400" text-anchor="start">server.mjs</text><rect x="435" y="235" width="335" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="435" y="235" width="5" height="110" rx="2" fill="#4A77A5" stroke="none" /><text x="453" y="267" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">Jobs + LangGraph</text><text x="453" y="295" font-size="18" fill="#647780" font-weight="400" text-anchor="start">单研究任务 · 8 个阶段</text><text x="453" y="321" font-size="18" fill="#647780" font-weight="400" text-anchor="start">状态推进与有界补救</text><rect x="815" y="235" width="330" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="815" y="235" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="833" y="267" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">共享比较器</text><text x="833" y="295" font-size="18" fill="#647780" font-weight="400" text-anchor="start">阈值、证据资格、加权分数</text><text x="833" y="321" font-size="18" fill="#647780" font-weight="400" text-anchor="start">浏览器即时 What-if 重算</text><rect x="55" y="395" width="335" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="55" y="395" width="5" height="110" rx="2" fill="#4A77A5" stroke="none" /><text x="73" y="427" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">研究工具适配</text><text x="73" y="455" font-size="18" fill="#647780" font-weight="400" text-anchor="start">model / search / fetchSource</text><text x="73" y="481" font-size="18" fill="#647780" font-weight="400" text-anchor="start">Ollama / tofu / 页面读取</text><rect x="435" y="395" width="335" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="435" y="395" width="5" height="110" rx="2" fill="#B28D4D" stroke="none" /><text x="453" y="427" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">Redis（可选）</text><text x="453" y="455" font-size="18" fill="#647780" font-weight="400" text-anchor="start">缓存成功搜索观察</text><text x="453" y="481" font-size="18" fill="#647780" font-weight="400" text-anchor="start">原始时间 + TTL + 降级</text><rect x="815" y="395" width="330" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="815" y="395" width="5" height="110" rx="2" fill="#4A77A5" stroke="none" /><text x="833" y="427" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">外部公开页面</text><text x="833" y="455" font-size="18" fill="#647780" font-weight="400" text-anchor="start">搜索引擎 · 商品/房源详情</text><text x="833" y="481" font-size="18" fill="#647780" font-weight="400" text-anchor="start">来源文字与原页图片</text><rect x="55" y="555" width="335" height="100" rx="12" fill="white" stroke="#C5D3D8" /><rect x="55" y="555" width="5" height="100" rx="2" fill="#173541" stroke="none" /><text x="73" y="587" font-size="22" fill="#173541" font-weight="700" text-anchor="start">SQLite 检查点</text><text x="73" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">thread_id = jobId</text><text x="73" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">执行状态，可恢复</text><rect x="435" y="555" width="335" height="100" rx="12" fill="white" stroke="#C5D3D8" /><rect x="435" y="555" width="5" height="100" rx="2" fill="#173541" stroke="none" /><text x="453" y="587" font-size="22" fill="#173541" font-weight="700" text-anchor="start">决策 JSON 版本</text><text x="453" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">问题、证据、分支、对话</text><text x="453" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">rootId / parentId / version</text><rect x="815" y="555" width="330" height="100" rx="12" fill="white" stroke="#C5D3D8" /><rect x="815" y="555" width="5" height="100" rx="2" fill="#173541" stroke="none" /><text x="833" y="587" font-size="22" fill="#173541" font-weight="700" text-anchor="start">本地服务配置</text><text x="833" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">与决策分开保存</text><text x="833" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不进入导出或公开仓库</text><text x="42" y="696" font-size="16" fill="#647780" font-weight="400" text-anchor="start">HTTP 服务不是 LangGraph 本身；Redis 不是任务队列；前台分支图不是后台执行图。</text></g></svg>