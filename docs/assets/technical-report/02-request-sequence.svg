th d="M1114,160 L1114,885" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)" stroke-dasharray="7 5"/><path d="M78,188 L226,188" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M226,233 L374,233" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M226,278 L78,278" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M374,323 L522,323" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M522,368 L670,368" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M670,413 L818,413" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M818,458 L670,458" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M670,503 L522,503" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M522,548 L966,548" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M522,593 L374,593" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M374,638 L1114,638" stroke="#4A77A5" stroke-width="2" fill="none" marker-end="url(#m4A77A5)"/><path d="M78,683 L226,683" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M226,728 L78,728" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M78,773 L226,773" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><path d="M226,818 L78,818" stroke="#28786D" stroke-width="2" fill="none" marker-end="url(#m28786D)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">02  一次研究请求的时序</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">接口先返回任务 ID；研究在后台完成；前端约每秒轮询。</text><rect x="14" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="78" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">浏览器</text><rect x="162" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="226" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">HTTP API</text><rect x="310" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="374" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">Jobs</text><rect x="458" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="522" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">LangGraph</text><rect x="606" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="670" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">工具适配</text><rect x="754" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="818" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">Redis</text><rect x="902" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="966" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">SQLite</text><rect x="1050" y="110" width="128" height="46" rx="8" fill="white" stroke="#C5D3D8" /><text x="1114" y="139" font-size="18" fill="#173541" font-weight="700" text-anchor="middle">JSON 版本</text><text x="152.0" y="179.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">POST /api/research</text><text x="300.0" y="224.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">start(question, adaptive)</text><text x="152.0" y="269.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">202 + jobId</text><text x="448.0" y="314.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">invoke：thread_id = jobId</text><text x="596.0" y="359.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">规划 / 搜索 / 读取</text><text x="744.0" y="404.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">GET 搜索缓存</text><text x="744.0" y="449.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">命中；或未命中后实际搜索</text><text x="596.0" y="494.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">标准化来源与工具观察</text><text x="744.0" y="539.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">按执行进度保存检查点</text><text x="448.0" y="584.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">result：经校验的决策空间</text><text x="744.0" y="629.0" font-size="16" fill="#4A77A5" font-weight="400" text-anchor="middle">save(result, resultId)</text><text x="152.0" y="674.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">GET /api/jobs/:id</text><text x="152.0" y="719.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">complete + spaceId</text><text x="152.0" y="764.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">GET /api/spaces/:id</text><text x="152.0" y="809.0" font-size="16" fill="#28786D" font-weight="400" text-anchor="middle">空间 JSON → 挂载与渲染</text><text x="42" y="936" font-size="16" fill="#647780" font-weight="400" text-anchor="start">事件先后为主链路示意；检查点可能写入多次，轮询可能进行多轮。</text></g></svg>