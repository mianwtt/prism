<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>03-search-pipeline</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#FBFCFD" stroke="none" /><path d="M295,170 L355,170" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M605,170 L665,170" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M790,230 L790,275" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M790,275 L220,275" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M220,275 L220,325" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M395,385 L425,385" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M775,385 L805,385" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M980,445 L980,500" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M980,500 L220,500" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M220,500 L220,555" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M395,612 L425,612" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M775,612 L805,612" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">04  搜索实现：应用边界与依赖内部</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">上层：Prism 调用边界；中层：tofu-search 多引擎发现、正文读取和词法重排。</text><rect x="45" y="115" width="250" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="115" width="5" height="115" rx="2" fill="#4A77A5" stroke="none" /><text x="63" y="147" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">研究节点</text><text x="63" y="175" font-size="18" fill="#647780" font-weight="400" text-anchor="start">模型生成短查询</text><text x="63" y="201" font-size="18" fill="#647780" font-weight="400" text-anchor="start">约束在读取后验证</text><rect x="355" y="115" width="250" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="355" y="115" width="5" height="115" rx="2" fill="#B28D4D" stroke="none" /><text x="373" y="147" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">Redis Cache-aside</text><text x="373" y="175" font-size="18" fill="#647780" font-weight="400" text-anchor="start">精确请求 Key</text><text x="373" y="201" font-size="18" fill="#647780" font-weight="400" text-anchor="start">成功结果短期复用</text><rect x="665" y="115" width="250" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="665" y="115" width="5" height="115" rx="2" fill="#28786D" stroke="none" /><text x="683" y="147" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">Node → Python</text><text x="683" y="175" font-size="18" fill="#647780" font-weight="400" text-anchor="start">spawn + JSON stdin/out</text><text x="683" y="201" font-size="18" fill="#647780" font-weight="400" text-anchor="start">75 秒进程等待上限</text><rect x="45" y="325" width="350" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="325" width="5" height="120" rx="2" fill="#4A77A5" stroke="none" /><text x="63" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">tofu：发现与去重</text><text x="63" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">DDG / Brave / Bing / SearXNG 等</text><text x="63" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">实际 engine 逐结果保留</text><rect x="425" y="325" width="350" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="425" y="325" width="5" height="120" rx="2" fill="#4A77A5" stroke="none" /><text x="443" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">tofu：正文收集</text><text x="443" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">URL 去重、正文提取与去重</text><text x="443" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">Prism 关闭可选 LLM 过滤</text><rect x="805" y="325" width="350" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="805" y="325" width="5" height="120" rx="2" fill="#4A77A5" stroke="none" /><text x="823" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">tofu：默认词法重排</text><text x="823" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">纯 Python BM25 + 弱先验</text><text x="823" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不是 Embedding 相似度</text><rect x="45" y="555" width="350" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="555" width="5" height="115" rx="2" fill="#28786D" stroke="none" /><text x="63" y="587" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">返回标准结构</text><text x="63" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">title / url / raw_content</text><text x="63" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">content / engine / 时间</text><rect x="425" y="555" width="350" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="425" y="555" width="5" height="115" rx="2" fill="#28786D" stroke="none" /><text x="443" y="587" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">额外详情读取</text><text x="443" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">公开房天下解析 / tofu fetch</text><text x="443" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">公开苏宁标价适配</text><rect x="805" y="555" width="350" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="805" y="555" width="5" height="115" rx="2" fill="#28786D" stroke="none" /><text x="823" y="587" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">字段证据校验</text><text x="823" y="615" font-size="18" fill="#647780" font-weight="400" text-anchor="start">实体、引文、数字与单位</text><text x="823" y="641" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不合格 → unknown / draft</text><text x="42" y="736" font-size="16" fill="#647780" font-weight="400" text-anchor="start">缓存命中直接返回；仅未命中/降级才调用搜索。依赖可因截止时间提前返回；独立详情读取不走搜索缓存。</text></g></svg>