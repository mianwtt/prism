 stroke="none" /><text x="1090" y="332" font-size="19" fill="#173541" font-weight="400" text-anchor="start">0.4579</text><text x="650" y="390" font-size="20" fill="#173541" font-weight="700" text-anchor="start">文档 C</text><rect x="650" y="407" width="2" height="24" rx="4" fill="#C5D3D8" stroke="none" /><text x="1090" y="427" font-size="19" fill="#173541" font-weight="400" text-anchor="start">0.0000</text><text x="650" y="510" font-size="17" fill="#647780" font-weight="400" text-anchor="start">A 命中 java 与 32gb；B 只命中 java；C 未命中。</text><text x="42" y="586" font-size="16" fill="#647780" font-weight="400" text-anchor="start">数值由公式计算；不是线上召回率、商品推荐分数或真实任务准确率。</text></g></svg>