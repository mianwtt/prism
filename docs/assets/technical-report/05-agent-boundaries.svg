<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>05-agent-boundaries</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FBFCFD" stroke="none" /><path d="M305,182 L337,182" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M597,182 L629,182" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M889,182 L921,182" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M1055,245 L1055,285" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M1055,285 L175,285" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M175,285 L175,325" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M305,387 L337,387" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M597,387 L629,387" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M889,387 L921,387" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">03  Agent 体现在哪里：模型决定内容，程序控制阶段</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">主通用图使用固定 addEdge 顺序；图内调用模型与工具，不是八个独立智能体。</text><rect x="45" y="120" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="120" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="63" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">understand</text><text x="63" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">生成字段与查询</text><text x="63" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">用户约束需原话支持</text><rect x="337" y="120" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="337" y="120" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="355" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">search</text><text x="355" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">执行查询与有限改写</text><text x="355" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">最多若干轮补救</text><rect x="629" y="120" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="629" y="120" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="647" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">read</text><text x="647" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">选择观察到的详情</text><text x="647" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">禁止虚构链接</text><rect x="921" y="120" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="921" y="120" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="939" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">extract</text><text x="939" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">提出结构化事实</text><text x="939" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">保留原文支持</text><rect x="45" y="325" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="325" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="63" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">corroborate</text><text x="63" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">查缺失项和其他来源</text><text x="63" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">保守身份合并</text><rect x="337" y="325" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="337" y="325" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="355" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">recover</text><text x="355" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">结果不足时补读</text><text x="355" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">受预算限制</text><rect x="629" y="325" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="629" y="325" width="5" height="125" rx="2" fill="#28786D" stroke="none" /><text x="647" y="357" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">complete</text><text x="647" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">校验、配图、组装</text><text x="647" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">生成空间与分支</text><rect x="921" y="325" width="260" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="921" y="325" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="939" y="357" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">analyze</text><text x="939" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">解释已有取舍</text><text x="939" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不能改计算排序</text><rect x="45" y="495" width="1135" height="90" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="495" width="5" height="90" rx="2" fill="#28786D" stroke="none" /><text x="63" y="527" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">确定性 Harness 边界</text><text x="63" y="555" font-size="18" fill="#647780" font-weight="400" text-anchor="start">类型 / URL / 预算 / 引文 / 单位 / 分支作用域 / 检查点 / 最终持久化</text><text x="42" y="626" font-size="16" fill="#647780" font-weight="400" text-anchor="start">Agent 的自主性在模型化、检索规划、链接选择和信息解释；完成图执行不等于取得足够可比较方案。</text></g></svg>