<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>06-evidence-gates</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="660" rx="0" fill="#FBFCFD" stroke="none" /><path d="M345,175 L420,175" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M760,175 L835,175" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M995,230 L995,275" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M995,275 L195,275" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M195,275 L195,345" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M345,407 L420,407" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M760,407 L835,407" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M590,230 L590,535" stroke="#AD5C55" stroke-width="2" fill="none" marker-end="url(#mAD5C55)" stroke-dasharray="7 5"/><path d="M995,470 L995,535" stroke="#AD5C55" stroke-width="2" fill="none" marker-end="url(#mAD5C55)" stroke-dasharray="7 5"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">06  一条事实怎样成为可用证据</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">校验的是保存资料对字段的支持性；不证明第三方发布内容在现实世界中绝对真实。</text><rect x="45" y="120" width="300" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="120" width="5" height="110" rx="2" fill="#4A77A5" stroke="none" /><text x="63" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">模型提议</text><text x="63" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">候选名 + field + value</text><text x="63" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">sourceId + quote</text><rect x="420" y="120" width="340" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="120" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="438" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">来源与实体</text><text x="438" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">名称存在于实际文本</text><text x="438" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">引文属于同一具体方案</text><rect x="835" y="120" width="320" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="835" y="120" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="853" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">数值与语义</text><text x="853" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">数值/单位/周期匹配</text><text x="853" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">内存 ≠ SSD；净重 ≠ 毛重</text><rect x="45" y="345" width="300" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="345" width="5" height="125" rx="2" fill="#28786D" stroke="none" /><text x="63" y="377" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">价格与身份口径</text><text x="63" y="405" font-size="18" fill="#647780" font-weight="400" text-anchor="start">排除起价、条件价、新闻价</text><text x="63" y="431" font-size="18" fill="#647780" font-weight="400" text-anchor="start">有支持的标识才允许合并</text><rect x="420" y="345" width="340" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="345" width="5" height="125" rx="2" fill="#28786D" stroke="none" /><text x="438" y="377" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">多来源观察</text><text x="438" y="405" font-size="18" fill="#647780" font-weight="400" text-anchor="start">一致值保留多条支持</text><text x="438" y="431" font-size="18" fill="#647780" font-weight="400" text-anchor="start">分歧值保留冲突</text><rect x="835" y="345" width="320" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="835" y="345" width="5" height="125" rx="2" fill="#28786D" stroke="none" /><text x="853" y="377" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">最终状态</text><text x="853" y="405" font-size="18" fill="#647780" font-weight="400" text-anchor="start">cited → 可引用</text><text x="853" y="431" font-size="18" fill="#647780" font-weight="400" text-anchor="start">confirmed → 人工选定观察</text><rect x="420" y="535" width="735" height="80" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="535" width="5" height="80" rx="2" fill="#AD5C55" stroke="none" /><text x="438" y="567" font-size="22" fill="#AD5C55" font-weight="700" text-anchor="start">拒绝或撤回</text><text x="438" y="595" font-size="18" fill="#647780" font-weight="400" text-anchor="start">unknown / draft：不填猜测值，不冒充完整比较方案</text><text x="590.0" y="373.5" font-size="16" fill="#AD5C55" font-weight="400" text-anchor="middle">不支持</text><text x="995.0" y="493.5" font-size="16" fill="#AD5C55" font-weight="400" text-anchor="middle">刷新失效</text><text x="42" y="636" font-size="16" fill="#647780" font-weight="400" text-anchor="start">图片另校验来源页面和身份，不能用照片推断数值参数；人工确认也不等于外部真实性认证。</text></g></svg>