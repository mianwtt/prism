<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>09-checkpoint-lifecycle</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="660" rx="0" fill="#FBFCFD" stroke="none" /><path d="M280,170 L365,160" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M280,215 L365,330" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M625,160 L745,240" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M625,335 L745,280" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M930,325 L930,420" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M930,420 L300,420" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M300,420 L300,480" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M560,535 L625,535" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">10  执行恢复、结果幂等与业务完成</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">三个标识：jobId 管执行；resultId 管提交结果；rootId 管决策版本家族。</text><rect x="40" y="135" width="240" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="135" width="5" height="115" rx="2" fill="#4A77A5" stroke="none" /><text x="58" y="167" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">running</text><text x="58" y="195" font-size="18" fill="#647780" font-weight="400" text-anchor="start">执行图节点</text><text x="58" y="221" font-size="18" fill="#647780" font-weight="400" text-anchor="start">持续保存任务事件</text><rect x="365" y="110" width="260" height="100" rx="12" fill="white" stroke="#C5D3D8" /><rect x="365" y="110" width="5" height="100" rx="2" fill="#AD5C55" stroke="none" /><text x="383" y="142" font-size="22" fill="#AD5C55" font-weight="700" text-anchor="start">failed</text><text x="383" y="170" font-size="18" fill="#647780" font-weight="400" text-anchor="start">捕获异常</text><text x="383" y="196" font-size="18" fill="#647780" font-weight="400" text-anchor="start">允许显式 resume</text><rect x="365" y="285" width="260" height="100" rx="12" fill="white" stroke="#C5D3D8" /><rect x="365" y="285" width="5" height="100" rx="2" fill="#B28D4D" stroke="none" /><text x="383" y="317" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">interrupted</text><text x="383" y="345" font-size="18" fill="#647780" font-weight="400" text-anchor="start">重启发现未完成任务</text><text x="383" y="371" font-size="18" fill="#647780" font-weight="400" text-anchor="start">恢复已保存检查点</text><rect x="745" y="195" width="400" height="130" rx="12" fill="white" stroke="#C5D3D8" /><rect x="745" y="195" width="5" height="130" rx="2" fill="#4A77A5" stroke="none" /><text x="763" y="227" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">resume → invoke</text><text x="763" y="255" font-size="18" fill="#647780" font-weight="400" text-anchor="start">thread_id = jobId</text><text x="763" y="281" font-size="18" fill="#647780" font-weight="400" text-anchor="start">跳过已提交的执行进度</text><text x="763" y="307" font-size="18" fill="#647780" font-weight="400" text-anchor="start">中断中的外部请求可能重试</text><rect x="40" y="480" width="520" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="480" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="58" y="512" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">写入固定 resultId</text><text x="58" y="540" font-size="18" fill="#647780" font-weight="400" text-anchor="start">已有同任务结果 → 返回既有版本</text><text x="58" y="566" font-size="18" fill="#647780" font-weight="400" text-anchor="start">临时文件 + 硬链接提交，旧版本保留</text><rect x="625" y="480" width="520" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="625" y="480" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="643" y="512" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">complete 的两种含义</text><text x="643" y="540" font-size="18" fill="#647780" font-weight="400" text-anchor="start">技术：研究已完成并保存</text><text x="643" y="566" font-size="18" fill="#647780" font-weight="400" text-anchor="start">业务：仍须看可比较方案与必要字段</text><text x="42" y="636" font-size="16" fill="#647780" font-weight="400" text-anchor="start">不能将检查点恢复宣传为外部请求 exactly-once，也不能把零可比较方案的 complete 当成研究成功。</text></g></svg>