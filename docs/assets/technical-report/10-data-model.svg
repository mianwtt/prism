<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>10-data-model</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="740" rx="0" fill="#FBFCFD" stroke="none" /><path d="M340,190 L450,190" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M750,190 L860,190" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M340,422 L450,422" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M750,422 L860,422" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M600,250 L600,350" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M1010,250 L1010,350" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">09  决策空间的数据模型</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">字段事实、来源、候选、情景与人的判断分开建模，便于核对和回看。</text><rect x="40" y="125" width="300" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="125" width="5" height="125" rx="2" fill="#28786D" stroke="none" /><text x="58" y="157" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">schema + settings</text><text x="58" y="185" font-size="18" fill="#647780" font-weight="400" text-anchor="start">字段类型 / 单位 / 方向</text><text x="58" y="211" font-size="18" fill="#647780" font-weight="400" text-anchor="start">阈值 / 权重 / 证据模式</text><rect x="450" y="125" width="300" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="450" y="125" width="5" height="125" rx="2" fill="#4A77A5" stroke="none" /><text x="468" y="157" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">scenarios[]</text><text x="468" y="185" font-size="18" fill="#647780" font-weight="400" text-anchor="start">parentScenarioId / overrides</text><text x="468" y="211" font-size="18" fill="#647780" font-weight="400" text-anchor="start">candidateIds / activeScenario</text><rect x="860" y="125" width="300" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="860" y="125" width="5" height="125" rx="2" fill="#B28D4D" stroke="none" /><text x="878" y="157" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">decision</text><text x="878" y="185" font-size="18" fill="#647780" font-weight="400" text-anchor="start">人的理由和所选方案</text><text x="878" y="211" font-size="18" fill="#647780" font-weight="400" text-anchor="start">保存当时条件与归一化</text><rect x="40" y="350" width="300" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="350" width="5" height="145" rx="2" fill="#28786D" stroke="none" /><text x="58" y="382" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">sources[]</text><text x="58" y="410" font-size="18" fill="#647780" font-weight="400" text-anchor="start">url / text / retrievedAt</text><text x="58" y="436" font-size="18" fill="#647780" font-weight="400" text-anchor="start">engine / query / cache 元数据</text><text x="58" y="462" font-size="18" fill="#647780" font-weight="400" text-anchor="start">来源图片与读取状态</text><rect x="450" y="350" width="300" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="450" y="350" width="5" height="145" rx="2" fill="#4A77A5" stroke="none" /><text x="468" y="382" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">candidates[].facts</text><text x="468" y="410" font-size="18" fill="#647780" font-weight="400" text-anchor="start">field → value / status</text><text x="468" y="436" font-size="18" fill="#647780" font-weight="400" text-anchor="start">sourceId / quote</text><text x="468" y="462" font-size="18" fill="#647780" font-weight="400" text-anchor="start">多个观察与冲突</text><rect x="860" y="350" width="300" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="860" y="350" width="5" height="145" rx="2" fill="#B28D4D" stroke="none" /><text x="878" y="382" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">media + conversation</text><text x="878" y="410" font-size="18" fill="#647780" font-weight="400" text-anchor="start">图片 URL 与来源绑定</text><text x="878" y="436" font-size="18" fill="#647780" font-weight="400" text-anchor="start">用户/助手消息及路径</text><rect x="40" y="565" width="1120" height="95" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="565" width="5" height="95" rx="2" fill="#173541" stroke="none" /><text x="58" y="597" font-size="22" fill="#173541" font-weight="700" text-anchor="start">持久化边界</text><text x="58" y="625" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不可覆盖的 JSON 版本：id / rootId / parentId / version / savedAt；检查点另在 SQLite，Redis 另存临时搜索观察。</text><text x="42" y="716" font-size="16" fill="#647780" font-weight="400" text-anchor="start">导出不带服务配置；导入是新根空间，不能继承人工确认资格或假装复建全部版本链。</text></g></svg>