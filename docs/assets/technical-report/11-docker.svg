<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title>11-docker</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="690" rx="0" fill="#FBFCFD" stroke="none" /><path d="M385,195 L455,195" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M800,195 L865,195" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M625,270 L625,390" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M500,270 L212,390" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">12  Docker：构建产物、运行进程和数据卷</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">容器提供进程与文件环境隔离；LangGraph 仍运行在容器内的 Node 应用中。</text><rect x="40" y="120" width="345" height="150" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="120" width="5" height="150" rx="2" fill="#4A77A5" stroke="none" /><text x="58" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">构建阶段 dependencies</text><text x="58" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">node:24-bookworm-slim</text><text x="58" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">编译 SQLite 所需工具</text><text x="58" y="232" font-size="18" fill="#647780" font-weight="400" text-anchor="start">npm ci --omit=dev</text><rect x="455" y="120" width="345" height="150" rx="12" fill="white" stroke="#C5D3D8" /><rect x="455" y="120" width="5" height="150" rx="2" fill="#28786D" stroke="none" /><text x="473" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">运行镜像</text><text x="473" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">复制 node_modules、src、public</text><text x="473" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">以 node 用户运行</text><text x="473" y="232" font-size="18" fill="#647780" font-weight="400" text-anchor="start">CMD node src/server.mjs</text><rect x="865" y="120" width="295" height="150" rx="12" fill="white" stroke="#C5D3D8" /><rect x="865" y="120" width="5" height="150" rx="2" fill="#28786D" stroke="none" /><text x="883" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">本机访问</text><text x="883" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">127.0.0.1:4317</text><text x="883" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">→ 容器 4317</text><text x="883" y="232" font-size="18" fill="#647780" font-weight="400" text-anchor="start">HTTP 健康检查</text><text x="420.0" y="186.0" font-size="16" fill="#647780" font-weight="400" text-anchor="middle">复制依赖</text><text x="832.5" y="186.0" font-size="16" fill="#647780" font-weight="400" text-anchor="middle">端口映射</text><rect x="40" y="390" width="345" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="390" width="5" height="145" rx="2" fill="#173541" stroke="none" /><text x="58" y="422" font-size="22" fill="#173541" font-weight="700" text-anchor="start">prism-data 数据卷</text><text x="58" y="450" font-size="18" fill="#647780" font-weight="400" text-anchor="start">/app/data</text><text x="58" y="476" font-size="18" fill="#647780" font-weight="400" text-anchor="start">决策 JSON + 任务 JSON</text><text x="58" y="502" font-size="18" fill="#647780" font-weight="400" text-anchor="start">SQLite + 本地服务配置</text><rect x="455" y="390" width="345" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="455" y="390" width="5" height="145" rx="2" fill="#B28D4D" stroke="none" /><text x="473" y="422" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">Redis 可选服务</text><text x="473" y="450" font-size="18" fill="#647780" font-weight="400" text-anchor="start">cache profile</text><text x="473" y="476" font-size="18" fill="#647780" font-weight="400" text-anchor="start">128MB 上限，过期/淘汰</text><text x="473" y="502" font-size="18" fill="#647780" font-weight="400" text-anchor="start">关闭磁盘持久化</text><rect x="865" y="390" width="295" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="865" y="390" width="5" height="145" rx="2" fill="#AD5C55" stroke="none" /><text x="883" y="422" font-size="22" fill="#AD5C55" font-weight="700" text-anchor="start">研究工具边界</text><text x="883" y="450" font-size="18" fill="#647780" font-weight="400" text-anchor="start">镜像未打包 tofu Python</text><text x="883" y="476" font-size="18" fill="#647780" font-weight="400" text-anchor="start">未打包商品浏览器</text><text x="883" y="502" font-size="18" fill="#647780" font-weight="400" text-anchor="start">需另行准备实际工具</text><text x="625.0" y="321.0" font-size="16" fill="#647780" font-weight="400" text-anchor="middle">可选缓存</text><text x="356.0" y="321.0" font-size="16" fill="#647780" font-weight="400" text-anchor="middle">挂载存储</text><text x="42" y="666" font-size="16" fill="#647780" font-weight="400" text-anchor="start">容器连 Redis 用 redis:6379；宿主机用 127.0.0.1:6379。CI 构建通过不代表全部实际研究工具已就绪。</text></g></svg>