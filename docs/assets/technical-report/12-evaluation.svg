<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>12-evaluation</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="730" rx="0" fill="#FBFCFD" stroke="none" /><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">12  验证分层：软件行为、缓存效果、真实研究分别判断</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">数据来自版本 0aa305f 的验收记录；控制实验不能代替外网研究评测。</text><rect x="45" y="120" width="1110" height="105" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="120" width="5" height="105" rx="2" fill="#28786D" stroke="none" /><text x="63" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">软件与集成行为</text><text x="63" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">173 单元/HTTP · 55 浏览器 · 3 真实 Redis；8 项远端 CI 任务通过</text><text x="65" y="287" font-size="22" fill="#173541" font-weight="700" text-anchor="start">受控重复查询：相同 3 个查询，各重复 3 次</text><text x="70" y="346" font-size="21" fill="#4A77A5" font-weight="700" text-anchor="start">关闭缓存</text><rect x="230" y="322" width="600.0" height="35" rx="5" fill="#4A77A5" stroke="none" /><text x="850.0" y="347" font-size="20" fill="#4A77A5" font-weight="700" text-anchor="start">9 次外部加载</text><text x="70" y="432" font-size="21" fill="#28786D" font-weight="700" text-anchor="start">开启 Redis</text><rect x="230" y="408" width="200.0" height="35" rx="5" fill="#28786D" stroke="none" /><text x="450.0" y="433" font-size="20" fill="#28786D" font-weight="700" text-anchor="start">3 次外部加载</text><text x="70" y="500" font-size="19" fill="#647780" font-weight="400" text-anchor="start">加载器固定约 20ms；单轮观测 258ms → 111ms，不是线上 SLA。</text><rect x="45" y="560" width="1110" height="105" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="560" width="5" height="105" rx="2" fill="#B28D4D" stroke="none" /><text x="63" y="592" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">真实研究：有限样本与已保留的失败</text><text x="63" y="620" font-size="18" fill="#647780" font-weight="400" text-anchor="start">杭州/成都最终任务各 6 个符合条件、带来源图房源；7 次交错开发调用不能当固定版本成功率。</text><text x="42" y="706" font-size="16" fill="#647780" font-weight="400" text-anchor="start">核心原则：图执行完成 ≠ 字段有依据 ≠ 满足条件 ≠ 来源事实已独立核验。</text></g></svg>