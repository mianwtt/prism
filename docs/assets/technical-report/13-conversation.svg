<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>13-conversation</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FBFCFD" stroke="none" /><path d="M300,285 L420,160" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M300,315 L420,340" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M300,350 L420,520" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M770,160 L870,270" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M770,340 L870,320" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M770,520 L870,380" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">11  一条追问如何改变系统行为</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">同一个输入框，共享空间上下文；解释、改条件、查新资料有不同执行成本。</text><rect x="45" y="255" width="255" height="125" rx="12" fill="white" stroke="#C5D3D8" /><rect x="45" y="255" width="5" height="125" rx="2" fill="#173541" stroke="none" /><text x="63" y="287" font-size="22" fill="#173541" font-weight="700" text-anchor="start">用户继续发消息</text><text x="63" y="315" font-size="18" fill="#647780" font-weight="400" text-anchor="start">携带当前 scenarioId</text><text x="63" y="341" font-size="18" fill="#647780" font-weight="400" text-anchor="start">历史与证据共同保存</text><rect x="420" y="105" width="350" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="105" width="5" height="110" rx="2" fill="#28786D" stroke="none" /><text x="438" y="137" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">问排除原因</text><text x="438" y="165" font-size="18" fill="#647780" font-weight="400" text-anchor="start">确定性资格 + 原因解释</text><text x="438" y="191" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不创建新分支</text><rect x="420" y="285" width="350" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="285" width="5" height="110" rx="2" fill="#4A77A5" stroke="none" /><text x="438" y="317" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">明确改变已有条件</text><text x="438" y="345" font-size="18" fill="#647780" font-weight="400" text-anchor="start">原话支持 + 值类型校验</text><text x="438" y="371" font-size="18" fill="#647780" font-weight="400" text-anchor="start">创建一个分支，保留原路径</text><rect x="420" y="465" width="350" height="110" rx="12" fill="white" stroke="#C5D3D8" /><rect x="420" y="465" width="5" height="110" rx="2" fill="#B28D4D" stroke="none" /><text x="438" y="497" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">请求继续查找 / 新关注点</text><text x="438" y="525" font-size="18" fill="#647780" font-weight="400" text-anchor="start">启动独立研究任务</text><text x="438" y="551" font-size="18" fill="#647780" font-weight="400" text-anchor="start">允许补查与模型扩展</text><rect x="870" y="235" width="285" height="175" rx="12" fill="white" stroke="#C5D3D8" /><rect x="870" y="235" width="5" height="175" rx="2" fill="#28786D" stroke="none" /><text x="888" y="267" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">统一结果保存</text><text x="888" y="295" font-size="18" fill="#647780" font-weight="400" text-anchor="start">实际动作写入消息</text><text x="888" y="321" font-size="18" fill="#647780" font-weight="400" text-anchor="start">路径范围各自保留</text><text x="888" y="347" font-size="18" fill="#647780" font-weight="400" text-anchor="start">新增 JSON 版本</text><text x="888" y="373" font-size="18" fill="#647780" font-weight="400" text-anchor="start">完整对话可回看</text><text x="42" y="626" font-size="16" fill="#647780" font-weight="400" text-anchor="start">一般取舍解释可调用模型，但不得声称本轮搜索过；只有真实任务执行才报告新的检索成果。</text></g></svg>