<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>07-whatif-inheritance</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="660" rx="0" fill="#FBFCFD" stroke="none" /><path d="M290,322 L365,322" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M610,300 L710,185" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M610,345 L710,420" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">07  What-if：继承条件与显式覆盖</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">教学数据：父分支修改内存后，未覆盖该字段的后续路径一起变化。</text><rect x="40" y="255" width="250" height="135" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="255" width="5" height="135" rx="2" fill="#173541" stroke="none" /><text x="58" y="287" font-size="22" fill="#173541" font-weight="700" text-anchor="start">当前情况（保留）</text><text x="58" y="315" font-size="18" fill="#647780" font-weight="400" text-anchor="start">预算 7000 · 内存 16GB</text><text x="58" y="341" font-size="18" fill="#647780" font-weight="400" text-anchor="start">原始候选范围不被覆盖</text><rect x="365" y="255" width="245" height="135" rx="12" fill="white" stroke="#C5D3D8" /><rect x="365" y="255" width="5" height="135" rx="2" fill="#28786D" stroke="none" /><text x="383" y="287" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">父分支：预算 8000</text><text x="383" y="315" font-size="18" fill="#647780" font-weight="400" text-anchor="start">内存 16 → 32GB</text><text x="383" y="341" font-size="18" fill="#647780" font-weight="400" text-anchor="start">这次编辑发生在这里</text><rect x="710" y="110" width="435" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="710" y="110" width="5" height="145" rx="2" fill="#4A77A5" stroke="none" /><text x="728" y="142" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">子分支：预算 5000</text><text x="728" y="170" font-size="18" fill="#647780" font-weight="400" text-anchor="start">overrides.limits = [price]</text><text x="728" y="196" font-size="18" fill="#647780" font-weight="400" text-anchor="start">内存继承：16 → 32GB</text><text x="728" y="222" font-size="18" fill="#647780" font-weight="400" text-anchor="start">预算仍为 5000</text><rect x="710" y="350" width="435" height="145" rx="12" fill="white" stroke="#C5D3D8" /><rect x="710" y="350" width="5" height="145" rx="2" fill="#B28D4D" stroke="none" /><text x="728" y="382" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">子分支：内存 24GB</text><text x="728" y="410" font-size="18" fill="#647780" font-weight="400" text-anchor="start">overrides.limits = [memory]</text><text x="728" y="436" font-size="18" fill="#647780" font-weight="400" text-anchor="start">内存保持 24GB</text><text x="728" y="462" font-size="18" fill="#647780" font-weight="400" text-anchor="start">显式覆盖不随父值改变</text><rect x="365" y="535" width="780" height="75" rx="12" fill="white" stroke="#C5D3D8" /><rect x="365" y="535" width="5" height="75" rx="2" fill="#28786D" stroke="none" /><text x="383" y="567" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">候选范围是另一条规则</text><text x="383" y="595" font-size="18" fill="#647780" font-weight="400" text-anchor="start">基于各自 candidateIds 重算；放宽条件时，不只考虑父路径已通过的候选。</text><text x="42" y="636" font-size="16" fill="#647780" font-weight="400" text-anchor="start">有意义的放宽子路径可以恢复匹配；无效空路径不应继续保留旧结果和箭头。</text></g></svg>