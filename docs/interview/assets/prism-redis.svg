<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>08-redis-cache</title><defs><marker id="m173541" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#173541"/></marker><marker id="m28786D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#28786D"/></marker><marker id="mB28D4D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B28D4D"/></marker><marker id="m4A77A5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A77A5"/></marker><marker id="mAD5C55" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AD5C55"/></marker><marker id="m647780" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647780"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1200" height="730" rx="0" fill="#FBFCFD" stroke="none" /><path d="M290,180 L365,180" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M625,180 L710,180" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><path d="M470,240 L300,325" stroke="#AD5C55" stroke-width="2" fill="none" marker-end="url(#mAD5C55)" stroke-dasharray="7 5"/><path d="M95,565 L1110,565" stroke="#647780" stroke-width="2" fill="none" marker-end="url(#m647780)"/><text x="42" y="45" font-size="27" fill="#173541" font-weight="700" text-anchor="start">08  Redis Cache-aside 与时间语义</text><text x="42" y="75" font-size="17" fill="#647780" font-weight="400" text-anchor="start">当前仅缓存搜索结果；正文核对、公开标价、What-if 计算和模型输出不在此缓存中。</text><rect x="40" y="120" width="250" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="120" width="5" height="120" rx="2" fill="#28786D" stroke="none" /><text x="58" y="152" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">search(query)</text><text x="58" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">请求计数 + Key 摘要</text><text x="58" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">按数据目录/参数隔离</text><rect x="365" y="120" width="260" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="365" y="120" width="5" height="120" rx="2" fill="#B28D4D" stroke="none" /><text x="383" y="152" font-size="22" fill="#B28D4D" font-weight="700" text-anchor="start">GET Redis</text><text x="383" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">格式 / Key / TTL 校验</text><text x="383" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">命中 → 返回独立副本</text><rect x="710" y="120" width="440" height="120" rx="12" fill="white" stroke="#C5D3D8" /><rect x="710" y="120" width="5" height="120" rx="2" fill="#4A77A5" stroke="none" /><text x="728" y="152" font-size="22" fill="#4A77A5" font-weight="700" text-anchor="start">未命中或不可用</text><text x="728" y="180" font-size="18" fill="#647780" font-weight="400" text-anchor="start">执行原 tofu / Tavily 搜索</text><text x="728" y="206" font-size="18" fill="#647780" font-weight="400" text-anchor="start">有效成功结果 → SET + EX</text><rect x="40" y="325" width="520" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="40" y="325" width="5" height="115" rx="2" fill="#AD5C55" stroke="none" /><text x="58" y="357" font-size="22" fill="#AD5C55" font-weight="700" text-anchor="start">故障处理</text><text x="58" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">连接/操作预算默认 300ms；关闭离线队列</text><text x="58" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">失败直接走原搜索，5 秒冷却后重试</text><rect x="625" y="325" width="525" height="115" rx="12" fill="white" stroke="#C5D3D8" /><rect x="625" y="325" width="5" height="115" rx="2" fill="#28786D" stroke="none" /><text x="643" y="357" font-size="22" fill="#28786D" font-weight="700" text-anchor="start">外层并发守卫：同进程在途合并</text><text x="643" y="385" font-size="18" fill="#647780" font-weight="400" text-anchor="start">包裹整个 GET / 搜索 / SET 路径，返回副本</text><text x="643" y="411" font-size="18" fill="#647780" font-weight="400" text-anchor="start">不是 Redis 分布式锁或多进程队列</text><text x="385.0" y="273.5" font-size="16" fill="#AD5C55" font-weight="400" text-anchor="middle">异常</text><circle cx="130" cy="565" r="7" fill="#B28D4D"/><text x="130" y="530" font-size="21" fill="#173541" font-weight="700" text-anchor="middle">10:00:00</text><text x="130" y="605" font-size="17" fill="#647780" font-weight="400" text-anchor="middle">首次采集 observedAt</text><circle cx="620" cy="565" r="7" fill="#B28D4D"/><text x="620" y="530" font-size="21" fill="#173541" font-weight="700" text-anchor="middle">10:03:00</text><text x="620" y="605" font-size="17" fill="#647780" font-weight="400" text-anchor="middle">缓存命中 servedAt</text><circle cx="1090" cy="565" r="7" fill="#B28D4D"/><text x="1090" y="530" font-size="21" fill="#173541" font-weight="700" text-anchor="middle">10:05:00</text><text x="1090" y="605" font-size="17" fill="#647780" font-weight="400" text-anchor="middle">默认 300 秒到期</text><text x="620" y="650" font-size="20" fill="#28786D" font-weight="700" text-anchor="middle">命中时 retrievedAt 仍是 10:00:00；不能伪装成 10:03:00 刚采集。</text><text x="42" y="706" font-size="16" fill="#647780" font-weight="400" text-anchor="start">无配置默认关闭；缓存可淘汰，已保存的证据和决策不因此丢失。</text></g></svg>